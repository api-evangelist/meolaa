description: Meolaa is an AI-first, digitally native FMCG company based in India, founded in 2023 by Ishita
  Sawant. It began as a curated e-commerce marketplace for clean, sustainable, direct-to-consumer brands
  across fashion, beauty, home, and baby care, and is expanding into building a portfolio of purpose-driven
  in-house microbrands (including HIRA) powered by a shared AI and data platform for cross-brand innovation,
  supply-chain resilience, and marketing. The company raised a $6M Pre-Series A round led by General Catalyst
  with Claypond Capital, Colossa Ventures, Turbostart Global, and Kunal Shah. Meolaa is a consumer company
  and does not currently publish a public developer API, developer portal, or API documentation.
